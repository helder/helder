# A main run's job end: what it compiled (the module cache's files newer
# than its restore, .github/actions/setup) handed to the cache job as an artifact, which merges every job's
# into the OS's one entry. helder's compiler builds of other sources than
# the newest two are dropped first (each is tens of MB).
name: save
description: the job's module cache handed to the cache job
runs:
  using: composite
  steps:
    - id: tar
      shell: bash
      run: |
        for d in ~/.cache/helder ~/Library/Caches/helder ~/AppData/Local/helder/cache; do
          for k in compiler compiler-web; do
            { ls -1td "$d/$k"/*/ 2> /dev/null || true; } | tail -n +3 | xargs -r rm -rf
          done
        done
        cd ~
        dirs=$(ls -d .cache/hxmc .cache/helder Library/Caches/hxmc Library/Caches/helder AppData/Local/hxmc/cache AppData/Local/helder 2> /dev/null || true)
        find $dirs -type f -newer "$RUNNER_TEMP/modules-restored" > "$RUNNER_TEMP/modules.txt"
        tar -cf "$RUNNER_TEMP/modules.tar" -T "$RUNNER_TEMP/modules.txt"
        du -sh $dirs "$RUNNER_TEMP/modules.tar"
        echo "name=modules-$RUNNER_OS-$GITHUB_JOB-$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ${{ steps.tar.outputs.name }}
        path: ${{ runner.temp }}/modules.tar
        retention-days: 1
        compression-level: 1
