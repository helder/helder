name: save
description: Refresh the shared compiler cache on main
inputs:
  key:
    description: Compiler cache key
    required: true
  prefix:
    description: OS and architecture prefix used for pruning
    required: true
runs:
  using: composite
  steps:
    - id: current
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
        if [ "$head" = "$GITHUB_SHA" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.current.outputs.save == 'true'
      shell: bash
      run: |
        for d in ~/.cache/helder ~/Library/Caches/helder ~/AppData/Local/helder/cache; do
          for k in compiler compiler-web; do
            [ -d "$d/$k" ] || continue
            ls -1td "$d/$k"/*/ 2> /dev/null | tail -n +3 | xargs -r rm -rf
          done
        done
    - id: save
      if: steps.current.outputs.save == 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: |
          ~/.cache/hxmc
          ~/.cache/helder
          ~/Library/Caches/hxmc
          ~/Library/Caches/helder
          ~/AppData/Local/hxmc/cache
          ~/AppData/Local/helder
        key: ${{ inputs.key }}
    - if: steps.save.outcome == 'success'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_PREFIX: ${{ inputs.prefix }}
      run: |
        entries=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$CACHE_PREFIX" --limit 100 --json id,key)
        # Confirm the new cache exists and this run still has main's tip.
        # Query the deletion candidates before checking the tip.
        jq -e --arg key "$CACHE_KEY" 'any(.[]; .key == $key)' <<< "$entries" > /dev/null || exit 0
        head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
        [ "$head" = "$GITHUB_SHA" ] || exit 0
        jq -r --arg key "$CACHE_KEY" '.[] | select(.key != $key) | .id' <<< "$entries" |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
