# The compilers' caches saved at a job's end (.github/actions/setup restored
# them; its `save` output says when): helder's compiler builds of other
# sources than the newest two dropped first (each is tens of MB; hxmc's
# module cache trims itself). On main, the job's older entries there are
# deleted once this one is saved: one a job, the newest, not one a merge
# until the repository's 10 GB evicts what pull requests need.
name: save
description: the compilers' caches saved
inputs:
  key:
    description: the setup step's key
    required: true
  prefix:
    description: the setup step's prefix (main's older entries of it deleted)
    default: ''
  extra:
    description: the setup step's extra paths, the same
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for d in ~/.cache/helder ~/Library/Caches/helder ~/AppData/Local/helder/cache; do
          for k in compiler compiler-web; do
            [ -d "$d/$k" ] || continue
            ls -1td "$d/$k"/*/ 2> /dev/null | tail -n +3 | xargs -r rm -rf
          done
        done
        du -sh ~/.cache/hxmc ~/.cache/helder ~/Library/Caches/hxmc ~/Library/Caches/helder ~/AppData/Local/hxmc/cache ~/AppData/Local/helder 2> /dev/null || true
    - uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/hxmc
          ~/.cache/helder
          ~/Library/Caches/hxmc
          ~/Library/Caches/helder
          ~/AppData/Local/hxmc/cache
          ~/AppData/Local/helder
          ${{ inputs.extra }}
        key: ${{ inputs.key }}
    - if: github.ref == 'refs/heads/main' && inputs.prefix != ''
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # (the job's entries on main, of any compiler, but the one just saved)
        prefix="${{ inputs.prefix }}"
        gh cache list --repo "${{ github.repository }}" --ref refs/heads/main --key "${prefix%%-hxmc-*}-hxmc-" --limit 100 --json id,key \
          --jq '.[] | select(.key != "${{ inputs.key }}") | .id' | while read -r id; do
          gh cache delete "$id" --repo "${{ github.repository }}" && echo "deleted main's older cache $id"
        done
