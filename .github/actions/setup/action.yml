# The compiler caches are content-addressed. Key the archive by OS and
# architecture, compiler version, lockfile and source tree so an old
# archive can warm a changed tree. Only one job per OS refreshes it.
name: setup
description: Set up Node, Bun and shared compiler caches
inputs:
  cache-writer:
    description: Whether this job refreshes the compiler cache on main
    default: 'false'
  node-version:
    description: Node version
    default: '22'
  playwright:
    description: Playwright version, with Chromium and its system packages
    default: ''
outputs:
  key:
    description: Compiler cache key
    value: ${{ steps.key.outputs.key }}
  prefix:
    description: OS and architecture prefix used for pruning
    value: ${{ steps.key.outputs.prefix }}
  save:
    description: Whether to refresh the compiler cache
    value: ${{ steps.save.outputs.save }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.5'
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # Also applies to the apt commands launched by Playwright.
        echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-helder-retries
        # EGL is absent from the runner image and depends on matching Mesa
        # libraries. Use the coherent Mesa version from the verified main build.
        sudo tee /etc/apt/preferences.d/helder-mesa <<'PREFERENCES'
        Package: src:mesa:any
        Pin: version 25.2.8-0ubuntu0.24.04.5
        Pin-Priority: 1001

        Package: src:mesa:any
        Pin: version *
        Pin-Priority: -1
        PREFERENCES
    - id: key
      shell: bash
      run: |
        hxmc=$(node -p "require('./package.json').dependencies['@hxmc/cli']")
        prefix="modules-${{ runner.os }}-${{ runner.arch }}-"
        toolchain="${prefix}hxmc-$hxmc-"
        revision=$(git rev-parse HEAD:bun.lock HEAD:src HEAD:tests HEAD:examples HEAD:apps HEAD:docs/examples HEAD:site | git hash-object --stdin)
        case "$RUNNER_OS" in
          Linux) legacy=examples ;;
          macOS) legacy=desktop-macos ;;
          Windows) legacy=desktop-windows ;;
        esac
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
        echo "key=$toolchain$revision" >> "$GITHUB_OUTPUT"
        echo "legacy=${{ runner.os }}-${{ runner.arch }}-$legacy-hxmc-$hxmc-" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/hxmc
          ~/.cache/helder
          ~/Library/Caches/hxmc
          ~/Library/Caches/helder
          ~/AppData/Local/hxmc/cache
          ~/AppData/Local/helder
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.toolchain }}
          ${{ steps.key.outputs.legacy }}
    - id: save
      shell: bash
      run: |
        echo "save=${{ inputs.cache-writer == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
    - shell: bash
      run: bun install --frozen-lockfile
    - id: pw-restore
      if: inputs.playwright != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ inputs.playwright }}
    - if: inputs.playwright != ''
      shell: bash
      run: |
        bun add --no-save playwright@${{ inputs.playwright }}
        if [ "${{ steps.pw-restore.outputs.cache-hit }}" = true ]; then
          bunx playwright install-deps chromium > /dev/null
        else
          bunx playwright install --with-deps chromium > /dev/null
        fi
    - if: inputs.playwright != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pw-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.pw-restore.outputs.cache-primary-key }}
