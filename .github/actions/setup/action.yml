# A job's start after its checkout: node and bun pinned, apt's retries and
# Mesa's version, the module cache restored (.github/actions/key: one per
# OS, every job's), bun install, Playwright's Chromium where asked. On main
# each job hands what it compiled to .github/actions/save; the cache job
# merges them into the OS's one entry.
name: setup
description: node, bun, the module cache, bun install
inputs:
  node-version:
    description: node's version
    default: '22'
  playwright:
    description: Playwright's version, installed with its Chromium (cached) and Chromium's system packages
    default: ''
outputs:
  save:
    description: whether the job's end hands its caches to the cache job (.github/actions/save)
    value: ${{ steps.save.outputs.save }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.5'
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # (Playwright's apt-get too)
        echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-helder-retries
        # (the goldens are this Mesa's llvmpipe: every job's Mesa packages
        # at one version, not the image's beside a newer one apt pulls in.
        # Preferred, not required: once Ubuntu drops it, apt takes the
        # newest rather than failing every job; bump it then)
        sudo tee /etc/apt/preferences.d/helder-mesa <<'PREFERENCES'
        Package: src:mesa:any
        Pin: version 25.2.8-0ubuntu0.24.04.5
        Pin-Priority: 1001
        PREFERENCES
    - id: key
      uses: ./.github/actions/key
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/hxmc
          ~/.cache/helder
          ~/Library/Caches/hxmc
          ~/Library/Caches/helder
          ~/AppData/Local/hxmc/cache
          ~/AppData/Local/helder
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - id: save
      shell: bash
      run: |
        # (what is newer than this, the job's, goes to the cache job: .github/actions/save)
        touch "$RUNNER_TEMP/modules-restored"
        echo "save=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.restore.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
    - shell: bash
      run: bun install --frozen-lockfile
    - id: pw-restore
      if: inputs.playwright != ''
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ inputs.playwright }}
    - if: inputs.playwright != ''
      shell: bash
      run: |
        bun add --no-save playwright@${{ inputs.playwright }}
        if [ "${{ steps.pw-restore.outputs.cache-hit }}" = true ]; then
          bunx playwright install-deps chromium > /dev/null
        else
          bunx playwright install --with-deps chromium > /dev/null
        fi
    - if: inputs.playwright != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.pw-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.pw-restore.outputs.cache-primary-key }}
