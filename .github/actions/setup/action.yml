# A job's start after its checkout: node and bun, the compilers' caches
# restored, bun install. The caches (actions/cache):
# - hxmc's module cache (~/.cache/hxmc, ~/Library/Caches/hxmc,
#   %LOCALAPPDATA%\hxmc\cache): typed modules and objects, content-addressed
#   per tool build (hxmc's CacheDir.hx; it trims itself past 1 GB);
# - helder's (~/.cache/helder, ...): helder's compiler and its web build,
#   each in a directory per hash of its sources and hxmc's version
#   (src/helder/compiler/build.mjs), the dev host, the fetched runtime objects.
# Both are keyed by what they are made from, so a restored entry is reused
# only where it still fits; the key is the OS, the job, @hxmc/cli's version
# (the compiler: a new one starts cold, nothing older is restored), the
# lockfile, then the sources (unchanged sources: the same key, nothing saved
# again). A job saves it at its end with .github/actions/save.
name: setup
description: node, bun, the compilers' caches, bun install
inputs:
  cache:
    description: the cache's name (the job's)
    required: true
  node-version:
    description: node's version
    default: '22'
outputs:
  key:
    description: the cache's key
    value: ${{ steps.key.outputs.key }}
  hit:
    description: the key restored exactly
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - uses: oven-sh/setup-bun@v2
    - id: key
      shell: bash
      run: |
        hxmc=$(node -p "require('./package.json').dependencies['@hxmc/cli']")
        prefix="${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-hxmc-$hxmc"
        # (git's hashes of the commit's files, not hashFiles: that one reads
        # every file, and timed out on a Mac busy booting its simulator)
        lock=$(git rev-parse HEAD:bun.lock | cut -c1-16)
        sources=$(git rev-parse HEAD:src HEAD:tests HEAD:examples HEAD:apps HEAD:docs/examples HEAD:site | git hash-object --stdin | cut -c1-16)
        echo "hxmc=$hxmc" >> "$GITHUB_OUTPUT"
        echo "lock=$lock" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix-$lock-$sources" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/hxmc
          ~/.cache/helder
          ~/Library/Caches/hxmc
          ~/Library/Caches/helder
          ~/AppData/Local/hxmc/cache
          ~/AppData/Local/helder
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}-${{ steps.key.outputs.lock }}-
          ${{ steps.key.outputs.prefix }}-
    - shell: bash
      run: |
        echo "cache: ${{ steps.restore.outputs.cache-matched-key || 'none' }} (hit: ${{ steps.restore.outputs.cache-hit || 'false' }})"
        bun install --frozen-lockfile
