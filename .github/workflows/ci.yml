# The checks (tests/Run.hx: bun run test <lane>), with @hxmc/cli's compiler
# installed by bun (package.json's dependencies; node runs the compiler's
# launcher and the test scripts). Each job starts with .github/actions/setup
# (node and bun pinned, the module cache restored: hxmc's and helder's, one
# entry per OS, .github/actions/key) and, on main, hands what it compiled to
# the cache job (.github/actions/save), which merges every job's into the
# OS's entry. Pull requests only restore it.
# - changes: what the change touches; one of docs alone (docs/**, **/*.md)
#   runs only the docs' checks (examples, site) and ci;
# - headless: the lanes that need no GPU, display or browser (bun run test -j 3
#   headless) but typescript and examples, which are jobs of their own; the
#   pack lane's Android half with bundletool (PACK_REQUIRE: the runtime
#   objects required), its iOS bundles kept for ios-signing's signing
#   lane; gfx-soft (helder.gfx on the CPU) a job of its own, with no Mesa;
# - typescript: the TypeScript frontend's checks (tests/typescript/run.mjs,
#   two jobs, --shard 0/2 and 1/2, four workers each);
# - examples: every example built (EXAMPLES_WEB=site: the web builds the
#   site job makes too left to it);
# - site: the examples' pages and the docs built (every web example's
#   build, an unknown example, region, page or link a failure) and checked
#   in headless Chromium (site-check: bun run site:check, its demos and
#   docs pages in two shards, a machine each);
# - fuzz (pushes to main, nightly): the robustness properties (images, PDF,
#   media containers, fonts, Markdown) and the UI monkeys soaked for 20 s
#   each from a random seed, then helder's TypeScript against node for 5
#   minutes (tests/typescript/fuzz), the failing cases (and a monkey's
#   scenario file) kept as an artifact;
# - css-reftests: helder.ui.box against WPT's CSS 2.1 reftests and its
#   noref tests against goldens headless Chromium draws (bin/wpt and the
#   goldens cached), the same fonts on every machine;
# - gfx, gfx-3d, gfx-apps: the native GPU and audio lanes on Mesa's
#   llvmpipe and Xvfb (gfx: helder.gfx, audio, ui, helder run --headless,
#   Wayland, helder.media on libavcodec; gfx-3d: helder.scene and helder.physics; gfx-apps: the demos,
#   syntax-run, the studio, the story host, the window lanes, the viewer's,
#   sprite, the app lane and the apps lane: apps/foundry and apps/tables built);
# - browser, studio-web: WebGPU, WebGL2, WebAudio and the DOM in headless
#   Chromium (the viewer's web build among ui-web's; touch, jobs and async
#   on the web; 3d-web's scenes a job of their own); helder studio built for the web (studio-web) and helder's
#   toolchain as wasm in a worker there (compiler-web), one build of it for both;
# - android: the android-device lane (tests/lanes/Pack.hx; its apps built first,
#   --build-only, then run on the emulator, --prebuilt): tests/pack/Hello.hx (helder run, adb), the
#   screen fixture (tests/pack/Screen.hx: its window, safe area and the
#   display's frames, a rotation, the background), helder dev's loop there
#   (tests/os/dev/dev-android.mjs), the cube's window and touches
#   (tests/gfx/android.sh), a drawn ui's touch fling (tests/os/android-touch.sh),
#   SurfaceControl's layers against the textured compositor (tests/ui/android-layers.sh),
#   MediaCodec's decoding and <Video> both ways (tests/media/android/android.sh),
#   native.jni from TypeScript (tests/typescript/native/android.sh), the
#   web view (tests/platform/webview-android.sh: a page through its scheme
#   handler, cross-origin isolated, wasm, the bridge's round trip, a
#   snapshot, examples/todo's web build in it; over a drawn window and on
#   the whole screen), the JVM fixtures translated to dex
#   (tests/pack/jvm.sh: their output against a JVM's, every class
#   verified) and Play Billing through helder's Maven libraries
#   (tests/pack/billing.sh: helder.store's Purchases, verified ahead of
#   time, a short error without the Play Store, the library's objects read
#   from fixture JSON; the libraries' downloads cached, bin/pack/cache/maven); the
#   APKs' own checks are the headless job's pack lane;
# - ios-simulator: the ios-device lane in two shards (--shard 0/2, 1/2), an
#   iPhone simulator each (tests/pack/simulator.sh: made and booting while
#   the apps build; shared by the shard's scripts through
#   HELDER_IOS_SIMULATOR; deleted at the end): pack-webview, tests/pack/Hello.hx (helder run,
#   simctl), the audio stream and the web view (tests/platform/webview-ios.sh,
#   as Android's); gfx, the cube's window and a tap (tests/gfx/ios.sh:
#   SimTap's clicks) and text input (tests/platform/textinput-ios.sh).
#   That is a pull request's
#   (IOS_SUITE=smoke); pushes to main and the nightly run the full suite:
#   the assets, the screen fixture, the planets example, UIAccessibility,
#   the cube's drags, fling and background, the whole-screen web view.
# - ios-signing (after headless): the signing lane, the headless job's iOS
#   bundles checked by codesign --verify, plutil -lint and assetutil, then
#   an iPhone's app signed for distribution by helder with a throwaway
#   identity, checked by codesign and assetutil;
# - desktop-macos, desktop-windows: the window lane (and helder's viewer,
#   apps/viewer), helder/native from TypeScript (typescript-native:
#   Objective-C, COM) and helder.gfx's shared textures between two
#   processes (gfx-shared: IOSurface, DXGI), the story host through them
#   (story-shared) on a macOS and a Windows runner; on macOS the web
#   view too (the webview-macos lane);
# - ci: always run, the required jobs' verdict (changes, headless,
#   typescript, examples, site, site-check): one check to require, also when a change
#   to the docs alone skips the others;
# - the viewer's releases are release.yml's (a tag viewer-v<version>);
# - the npm packages' nightlies are npm.yml's.
# gfx, gfx-3d, gfx-apps, browser, studio-web, android, ios-simulator, ios-signing,
# fuzz and the desktops are not required (continue-on-error) while the
# stack is unstable (android and ios-simulator were written without an
# emulator, a simulator or a Mac: CI is where they run).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # (labeled: adding full-ci reruns a pull request with every job;
    # ready_for_review: a draft runs nothing until marked ready)
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    # (nightly: the full iOS suite and the fuzzers on main)
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # (main's older module caches deleted once the cache job saved the newest)
  actions: write

concurrency:
  # (a pull request's newer push cancels its run; a started run of main or
  # the nightly always finishes, and of those waiting behind it only the
  # newest runs next: one run per merge queued every job, 4 at once)
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.event_name == 'schedule' && 'nightly' || 'run') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # (test windows that never take the focus)
  HELDER_BACKGROUND: 1
  # (no machine-wide job limit: the runners are single-tenant, src/helder/cli/Slots.hx)
  HELDER_JOBS: 0
  # (the merged cache whole, not trimmed by a job: the cache job trims it)
  HXMC_CACHE_SIZE: 4G

jobs:
  changes:
    # (a draft pull request runs no job: every job needs this one; ~14 open
    # pull requests each queuing ~20 jobs jammed the runners)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.code.outputs.code }}
      # (a pull request runs the macOS, iOS, Android and Windows jobs only
      # when labelled full-ci: 3 macOS jobs per run jammed the 5 runners;
      # main and the nightly always run them)
      full: ${{ steps.code.outputs.code == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      - id: code
        run: echo "code=${{ (github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.code == 'true' }}" >> "$GITHUB_OUTPUT"

  # (the lanes 3 at once, pack first, its longest; gfx-soft a job of its own)
  headless:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: lanes, run: -j 3 headless -x typescript -x examples -x gfx-soft}
          # (helder.gfx on the CPU: static builds, no Mesa; its shaders' check alone is a large build)
          - {part: soft, run: gfx-soft}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24}
      - name: Fonts (DejaVu Sans, for text and ui), libEGL and Mesa's llvmpipe
        # (helder test's host build links helder.gfx's libEGL.so.1 when a test
        # reaches the scene; nothing opens a display. llvmpipe: the pack
        # lane's store screenshots, rendered offscreen: STORE_SHOTS_REQUIRE)
        if: matrix.part != 'soft'
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core fonts-liberation libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Headless checks
        # (pack: the Android and iOS runtime objects fetched and required;
        # the SDK's build tools on the PATH: zipalign, aapt, apksigner;
        # bundletool: the App Bundle validated and its APKs built)
        env:
          STORE_SHOTS_REQUIRE: 1
          PACK_REQUIRE: 1
        run: |
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          export BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          bun run test -k ${{ matrix.run }}
      # (pack's iOS bundles for the signing lane on the iOS job's Mac:
      # Apple's tools check them there, nothing built again)
      - if: ${{ !cancelled() && matrix.part == 'lanes' }}
        run: tar -C bin/pack -cf "$RUNNER_TEMP/ios-pack.tar" Packed-signed.ipa Hello-signed.ipa Hello.ipa Hello.app project/bin/ios-sim/Packed.app Screen.app Checksum.app Checksum.ipa
      - if: ${{ !cancelled() && matrix.part == 'lanes' }}
        uses: actions/upload-artifact@v7
        with: {name: ios-pack, path: '${{ runner.temp }}/ios-pack.tar', retention-days: 1, if-no-files-found: error}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # (two jobs, 4 workers each: --shard, tests/typescript/run.mjs; one job's
  # 4 cores took 5.5 min)
  typescript:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24}
      - name: Fonts and libEGL (the programs rendering headless)
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core fonts-liberation libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: TypeScript declarations
        if: matrix.part == 0
        run: bun run test declarations
      - name: The TypeScript frontend (tests/typescript/run.mjs, sharded)
        run: bun run test typescript --shard ${{ matrix.part }}/2 --jobs 4
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  examples:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24}
      - name: Fonts (DejaVu Sans) and libEGL
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core fonts-liberation libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Every example built (the web builds the site job makes too, there)
        env:
          EXAMPLES_WEB: site
        run: bun run test examples
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # The examples' pages and the docs (site/, docs/: bun run site), built and
  # checked, not deployed: helder.build's deploy builds them from main on its
  # own theme and serves them at helder.build/examples/ and /docs/. Here:
  # every example that runs in a browser built for the web (the examples
  # job leaves those builds to this one), the pages and the docs built and
  # run (an unknown example, region, component, page or heading link fails
  # the build), then the pages in headless Chromium (bun run site:check:
  # every card, every demo played, every docs page and the docs' own
  # examples, the top bar's links on an iPhone's screen), its screenshots
  # kept a week. SITE_SKIP_DATA: the examples of fetched models (Sponza's,
  # tens of MB) listed without a Play button (the examples job builds them).
  site:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24}
      - name: Fonts (DejaVu Sans, for the ui and text examples)
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core
      - name: Build
        env:
          SITE_SKIP_DATA: 1
        run: bun run site
      # (the built site for site-check's machines)
      - uses: actions/upload-artifact@v7
        with: {name: site-built, path: "bin/site\nbin/site-build/examples.json", retention-days: 1, compression-level: 1}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # The site's check (bun run site:check), its demos and docs pages in two
  # shards (--shard), a machine each: on one machine, two Chromiums'
  # SwiftShader starved each other's frames (a heavy demo's canvas beside
  # the other's); each is alone on its cores as main's single check was.
  site-check:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24, playwright: 1.56.1}
      - name: Fonts (DejaVu Sans), Mesa
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core libegl1 libegl-mesa0
      - uses: actions/download-artifact@v7
        with: {name: site-built, path: bin}
      - name: Check (the pages in Chromium)
        run: bun run site:check --shard ${{ matrix.shard }}/2 bin/site-check
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'site-${{ matrix.shard }}', path: bin/site-check/*.png, retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # helder.ui.box against WPT's CSS 2.1 reftests, and its noref tests
  # against goldens Chromium draws (bun run test css-reftests): the same
  # fonts on every machine (DejaVu, Ahem, WPT's test fonts), so the
  # manifest blessed on a Mac holds here. bin/wpt is cached by
  # import-wpt.mjs (its REVISION, DejaVu's version), the goldens by their
  # directory's key (WPT's revision, Chromium's version, how they're
  # drawn): restored from the last, saved when the key is new.
  css-reftests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24, playwright: 1.56.1}
      - id: wpt
        uses: actions/cache/restore@v6
        with:
          path: |
            bin/wpt
            bin/fonts
          key: css-wpt-${{ hashFiles('tests/css/import-wpt.mjs') }}
      - id: goldens
        uses: actions/cache/restore@v6
        with:
          path: bin/css/goldens
          key: css-goldens-${{ github.sha }}
          restore-keys: css-goldens-
      - name: The reftests and the noref tests' goldens
        run: bun run test -k css-reftests
      - id: key
        if: ${{ !cancelled() }}
        run: |
          current=$(basename "$(cat bin/css/goldens/current)")
          # (the goldens of other keys out: one directory cached)
          find bin/css/goldens -mindepth 1 -maxdepth 1 -type d ! -name "$current" -exec rm -rf {} +
          echo "key=css-goldens-$current" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.key.outputs.key != '' && steps.goldens.outputs.cache-matched-key != steps.key.outputs.key }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with: {path: bin/css/goldens, key: '${{ steps.key.outputs.key }}'}
      - if: ${{ !cancelled() && steps.wpt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            bin/wpt
            bin/fonts
          key: ${{ steps.wpt.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {node-version: 24}
      - name: the robustness properties soaked for 20 s each, the TypeScript fuzzer for 5 minutes (bun run test fuzz)
        run: bun run test fuzz
      # (a case that failed, hung, crashed or blew up: replayed first by helder test)
      - if: failure()
        uses: actions/upload-artifact@v7
        with: {name: fuzz-cases, path: "bin/fuzz/properties\nbin/fuzz/monkey", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  gfx:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core fonts-inter libgtk-3-0t64 dbus at-spi2-core fonts-noto-color-emoji fonts-freefont-ttf libharfbuzz0b libfreetype6 fontconfig libtiff6 libheif1 libheif-plugin-aomdec libraw23t64 osslsigncode desktop-file-utils appstream libenchant-2-2 hunspell-en-us libavcodec60
      # (a headless weston for the wayland lane, the protocols' XML (KDE's blur too), xcompmgr and libXtst for X11's transparent window and its clicks; without them the lane only builds)
      - name: Wayland's packages
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get install -qqy --no-install-recommends weston wayland-protocols libwayland-dev libwayland-egl1 libxkbcommon0 xcompmgr libxtst6 plasma-wayland-protocols
      - name: gfx, audio, ui, helder run --headless, the shared textures and the story host across processes, Wayland (a headless weston), the platform's text, images and media decoders (Mesa llvmpipe, Xvfb; libavcodec, no VAAPI driver)
        # (two at once: headless-run alone was 171 s of the step's 235)
        run: bun run test -k -j 2 headless-run gfx gfx-compute gfx-shared story-shared audio ui-draw wayland dbus system-text system-images canvas-gpu sprite
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: images, path: "bin/gfx/**/*.png\nbin/headless-run/**/*.png\nbin/canvas/*.png\nbin/ui/**/*.png\nbin/text/*.png\nbin/os/**/*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # helder.scene and helder.physics (the 3d lane), a job of their own: its
  # builds (about 20 programs, made at once) and frames were half of gfx's
  gfx-3d:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth fonts-dejavu-core fonts-inter libharfbuzz0b libfreetype6 fontconfig
      - name: helder.scene and helder.physics (Mesa llvmpipe, Xvfb)
        # (3 builds at once: the runner's 4 cores)
        run: bun run test 3d --jobs 3
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: images-3d, path: "bin/3d/**/*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # (two jobs: the demos and the viewer's packages and windows; the studio's
  # lanes. One took 7 min)
  gfx-apps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: apps, lanes: demos viewer-package window}
          - {part: studio, lanes: studio syntax-run story-host viewer-window app apps}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 xvfb xauth libasound2t64 fonts-dejavu-core fonts-inter libgtk-3-0t64 dbus at-spi2-core fonts-noto-color-emoji fonts-freefont-ttf libharfbuzz0b libfreetype6 fontconfig libtiff6 libheif1 libheif-plugin-aomdec libraw23t64 osslsigncode desktop-file-utils appstream libenchant-2-2 hunspell-en-us
      - name: The showcase demos headless, helder.syntax's edits run headless, helder studio headless, the story host, a window, the viewer's (Mesa llvmpipe, Xvfb; its release packages)
        run: bun run test -k ${{ matrix.lanes }}
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'images-${{ matrix.part }}', path: "bin/demos/*.png\nbin/studio-check/*.png\nbin/os/*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # (two jobs: 3d-web's runs, one at a time on a machine's cores as
  # SwiftShader's frames need (three shards spent 43 s of setup and the same
  # SceneWebCheck.wasm build each for 60 s of runs); the other lanes)
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: scenes, lanes: 3d-web}
          - {shard: lanes, lanes: gfx-web ui-web canvas-web web canvas-doc audio-web gfx-compute-web touch-web jobs-web async-web}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {playwright: 1.56.1}
      - name: Fonts, poppler, Mesa
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core poppler-utils libegl1 libegl-mesa0
      - name: gfx, 3d, audio, web and ui in Chromium
        env:
          # (a pull request's: every scene headless on both APIs, in the
          # window those whose frames the canvas and the browser's loop could
          # change: a glTF, a texture, skinning, GPU particles, the temporal
          # and the post passes, transmission, levels of detail; main and the
          # nightly: every one in both)
          SCENES_WINDOW: ${{ github.event_name == 'pull_request' && 'gltf,textured,skin,gpuparticles,taa,motionblur,bloom,transmission,lod' || '' }}
        run: bun run test -k ${{ matrix.lanes }}
      # (the frames each API drew: a golden's difference seen)
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'images-browser-${{ matrix.shard }}', path: "bin/3d/*-webgpu-*.png\nbin/3d/*-webgl2-*.png\nbin/ui/viewer/*.png\nbin/ui/web-layers-*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  studio-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with: {playwright: 1.56.1}
      - name: Fonts, Mesa
        run: sudo apt-get update -qq && sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core libegl1 libegl-mesa0
      # Keep the expensive Brotli results separate from the shared compiler cache.
      - id: compiler-web
        uses: actions/cache/restore@v6
        with:
          path: |
            bin/compiler-web/*.br
            bin/compiler-web/manifest.json
          key: compiler-web-br-${{ hashFiles('bun.lock', 'src/**') }}
          restore-keys: compiler-web-br-
      # (one job: compiler-web's toolchain is studio-web's too, built once in bin/compiler-web)
      - name: helder studio in the browser, helder's compiler in the browser
        run: bun run test -k studio-web compiler-web
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: studio-web, path: "bin/studio-web/*.png\nbin/studio-web/results.md", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.compiler-web.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            bin/compiler-web/*.br
            bin/compiler-web/manifest.json
          key: ${{ steps.compiler-web.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # Android on an x86-64 emulator with KVM (reactivecircus/android-emulator-runner,
  # API 34, as hxmc's CI): tests/pack/android.sh (helder run --target
  # android: built for the emulator's ABI, installed, started, the hello line
  # from logcat; then the APK by adb alone; then tests/pack/Screen.hx,
  # checked by tests/pack/screen.mjs) and tests/os/dev/dev-android.mjs
  # (helder dev --target android: the APK installed once, two edits swapped
  # into the same process, the state kept). A Pixel 6's profile: a
  # navigation bar and a camera's cutout, for the insets. (The APKs' and the
  # App Bundle's checks without a device, bundletool's too, are the
  # headless job's pack lane.)
  android:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      # (the Maven libraries billing.sh and jvm.sh fetch: billing's tree,
      # kotlin-stdlib; keyed by what names their versions)
      - name: Maven's libraries
        id: maven
        uses: actions/cache/restore@v6
        with:
          path: bin/pack/cache/maven
          key: maven-${{ hashFiles('src/helder/pack/android/Maven.hx', 'tests/pack/jvm/JvmDex.hx', 'src/helder/store/android/AndroidPurchases.hx') }}
          restore-keys: maven-
      - name: The CLI, Android's runtime objects, the device tests' apps (bun run test android-device --build-only)
        env:
          PACK_REQUIRE: 1
        run: bun run test android-device --build-only
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Hello and helder dev on an emulator (x86-64, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          HXMC_RT_DIR: ${{ github.workspace }}/bin/pack/rt
          HELDER_CACHE: ${{ github.workspace }}/bin/pack/cache
        with:
          api-level: 34
          arch: x86_64
          target: default
          # (a phone's screen: a navigation bar, its density; the generic
          # device has hardware keys and no bar, so no inset)
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bun run test android-device --prebuilt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android
          path: |
            bin/pack/android/*.txt
            bin/pack/android/*.png
            bin/pack/android-gfx/*.txt
            bin/pack/android-gfx/*.png
            bin/pack/android-layers/*.txt
            bin/pack/android-layers/*.png
            bin/pack/android-media/*.txt
            bin/pack/android-media/*.png
            bin/pack/android-ts/*.txt
            bin/pack/android-webview/*.txt
            bin/pack/android-webview/*.png
            bin/pack/android-jvm/*.txt
            bin/pack/android-billing/*.txt
            bin/pack/*.apk
          retention-days: 7
          if-no-files-found: ignore
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.maven.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: bin/pack/cache/maven
          key: ${{ steps.maven.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # iOS on an iPhone simulator of a macOS runner (Apple silicon: hxmc's
  # ios-sim-arm64), as hxmc's CI. One simulator for the job: made and
  # booting first (its first boot on a fresh runner is minutes), while the
  # CLI and every app the scripts install are built (IOS_BUILD_ONLY, the
  # three scripts at once); then the scripts on it (HELDER_IOS_SIMULATOR,
  # IOS_PREBUILT: the builds kept): tests/pack/ios.sh (helder run --target
  # ios -d <it>: installed, launched, the hello line from the app's output;
  # the audio stream; full: the assets, tests/pack/Screen.hx checked by
  # tests/pack/screen.mjs, the planets example, UIAccessibility),
  # tests/gfx/ios.sh, tests/platform/webview-ios.sh, textinput-ios.sh (gfx's
  # shard: fields typed into, under the Main Thread Checker, 20 s). IOS_SUITE: smoke on a
  # pull request, full on main and nightly.
  # (two shards, a simulator each: its boot and first app, three and a half
  # minutes, the floor of both; pack-webview's builds take about that
  # beside it, gfx's a minute. The CLI and helder's compiler built before
  # the simulator is made: beside its first boot they took 245 and 190 s,
  # 4 and 17 s without it; the apps while it boots. One job: 910 s)
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: 0, name: pack-webview}
          - {index: 1, name: gfx}
    env:
      IOS_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
    steps:
      - uses: actions/checkout@v7
      # (setup first: beside a booting simulator, setup-node and setup-bun
      # took 1 and 3 minutes, 20 s otherwise)
      - id: setup
        uses: ./.github/actions/setup
      # (helder's compiler before the simulator: beside its first boot it took 190 s, 17 s without)
      - run: node src/helder/compiler/build.mjs > /dev/null
      - name: The simulator's checks (bun run test ios-device, a simulator booting while the apps build)
        run: bun run test ios-device --shard ${{ matrix.index }}/2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-${{ matrix.name }}
          path: |
            bin/pack/ios/*.txt
            bin/pack/ios/*.png
            bin/pack/ios-gfx/*.txt
            bin/pack/ios-gfx/*.png
            bin/pack/ios-webview/*.txt
            bin/pack/ios-webview/*.png
            bin/pack/ios-textinput/*.txt
            bin/pack/ios-textinput/*.png
          retention-days: 7
          if-no-files-found: ignore
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # pack's iOS bundles, the headless job's, checked by Apple's tools (the
  # signing lane, nothing rebuilt), then an iPhone's app signed for
  # distribution. A job of its own, after headless: ios-simulator's gfx
  # shard once waited for them and gave up at 15 minutes while the headless
  # job was still queued for a runner. A headless job that failed without
  # them says why itself: noted here, not failed twice.
  ios-signing:
    needs: [changes, headless]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' && needs.headless.result != 'skipped' }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: pack's iOS bundles (the headless job's)
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
          HEADLESS: ${{ needs.headless.result }}
        run: |
          out="$RUNNER_TEMP/ios-pack"
          listed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=ios-pack" --jq '.total_count')
          if [ "$listed" = 0 ]; then
            if [ "$HEADLESS" != success ]; then
              echo "::notice::no ios-pack artifact: the headless job ended in $HEADLESS before pack's iOS bundles; its own log says why"
              exit 0
            fi
            echo "::error::no ios-pack artifact, though the headless job passed"
            exit 1
          fi
          # (a gh call that fails is a try; the artifact is listed, its job ended)
          for i in 1 2 3; do
            rm -rf "$out"
            gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n ios-pack -D "$out" && [ -s "$out/ios-pack.tar" ] && break
            sleep 10
          done
          [ -s "$out/ios-pack.tar" ] || { echo "::error::ios-pack listed, not downloaded"; exit 1; }
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: The bundles and distribution signing checked by Apple's tools (bun run test signing)
        if: steps.bundles.outputs.ready == 'true'
        env:
          PACK_PREBUILT: 1
        run: |
          mkdir -p bin/pack
          tar -C bin/pack -xf "$RUNNER_TEMP/ios-pack/ios-pack.tar"
          bun run test signing
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # The desktops beside Linux's: macOS (Apple silicon) and Windows, their
  # windows (the window lane: a drop through each system's own mechanism,
  # moveTo and position, fullscreen) on the runner's own session.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: macOS x86-64's runtime objects (the universal bundle's second slice)
        run: |
          v=$(node -p "require('./node_modules/@hxmc/cli/package.json').version")
          mkdir -p "$RUNNER_TEMP/rt" && (cd "$RUNNER_TEMP/rt" && npm pack "@hxmc/darwin-x64@$v" > /dev/null && tar xzf hxmc-darwin-x64-*.tgz)
          # (HXMC_RT_DIR is where helder's compiler looks then: arm64's objects there too)
          cp -R node_modules/@hxmc/darwin-arm64/macos-arm64 "$RUNNER_TEMP/rt/package/"
          echo "HXMC_RT_DIR=$RUNNER_TEMP/rt/package" >> "$GITHUB_ENV"
      - name: window, Liquid Glass's input (glass-window), the viewer (its tests, its builds, a real window, its app bundle, its release packages), helder/native from TypeScript (Core Foundation, Objective-C), helder.store's bundle (StoreKit 2), shared textures (IOSurface, helder.gfx's and the story host's)
        run: bun run test -k os window glass-window viewer viewer-window viewer-app viewer-package store system-images system-text typescript-native gfx-shared story-shared gfx-compute
      - name: The web view (tests/platform/webview-macos.sh, WKWebView in a drawn window)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run test webview-macos
      - uses: actions/upload-artifact@v7
        if: always()
        # (and CoreText's sheets for the text-quality lane: tests/text/coretext/sheets is a copy of bin/text/coretext)
        with: {name: text-macos, path: "bin/text/*.png\nbin/text/coretext/*", retention-days: 7, if-no-files-found: ignore}
      # (the window lane's <Video> both ways, the window server's captures and helder's frame: tests/media/apple/VideoWindowCheck.hx)
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: video-window-macos, path: "bin/media/video-window/*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  desktop-windows:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # (bun's shims are .exe, not haxe.cmd)
      HAXE: haxe
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: window, the viewer (its tests, its builds, a real window), the system's decoders, helder/native from TypeScript (COM), shared textures (DXGI, helder.gfx's and the story host's)
        run: bun run test -k os window viewer viewer-window system-images system-text typescript-native gfx-shared story-shared gfx-compute tls
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: text-windows, path: "bin/text/*.png", retention-days: 7, if-no-files-found: ignore}
      - if: ${{ !cancelled() && steps.setup.outputs.save == 'true' }}
        uses: ./.github/actions/save

  # main's module caches: every job's files (.github/actions/save) laid over
  # the OS's last entry, trimmed by hxmc (least recently used first, past
  # HXMC_CACHE_SIZE: an hxmc build, the CLI's, with its last trim's time
  # removed), saved as the OS's one entry, the older entries deleted (a run
  # that ends after a newer one's: its merge restored first, still warm).
  cache:
    needs: [changes, headless, typescript, examples, site, site-check, css-reftests, fuzz, gfx, gfx-3d, gfx-apps, browser, studio-web, android, ios-simulator, ios-signing, desktop-macos, desktop-windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      HXMC_CACHE_SIZE: 1500M
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - id: key
        uses: ./.github/actions/key
      - uses: actions/download-artifact@v7
        if: steps.setup.outputs.save == 'true'
        continue-on-error: true
        with: {pattern: 'modules-${{ runner.os }}-*', path: '${{ runner.temp }}/modules'}
      - id: merge
        if: steps.setup.outputs.save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (relative names: Windows' tar takes D:\ for a remote host)
          [ -d "$RUNNER_TEMP/modules" ] || { echo "no job handed over a module cache"; exit 0; }
          # (one artifact is downloaded flat, several each in its directory)
          cd "$RUNNER_TEMP/modules"
          find . -name modules.tar | while read -r t; do tar -C ~ -xf "$t"; done
          cd ~
          dirs=$(ls -d .cache/hxmc .cache/helder Library/Caches/hxmc Library/Caches/helder AppData/Local/hxmc/cache AppData/Local/helder 2> /dev/null || true)
          du -sh $dirs
          find $dirs -name trim.txt -delete
          cd "$GITHUB_WORKSPACE"
          node src/helder/cli/run.mjs help > /dev/null
          for d in ~/.cache/helder ~/Library/Caches/helder ~/AppData/Local/helder/cache; do
            for k in compiler compiler-web; do
              { ls -1td "$d/$k"/*/ 2> /dev/null || true; } | tail -n +3 | xargs -r rm -rf
            done
          done
          (cd ~ && du -sh $dirs)
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - id: save
        if: steps.merge.outputs.merged == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/hxmc
            ~/.cache/helder
            ~/Library/Caches/hxmc
            ~/Library/Caches/helder
            ~/AppData/Local/hxmc/cache
            ~/AppData/Local/helder
          key: ${{ steps.key.outputs.key }}
      - if: steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (all but the newest saved, this run's or a later one's; an older
          # hxmc's too)
          prefix="${{ steps.key.outputs.prefix }}"
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "${prefix%%hxmc-*}" --limit 100 --sort created_at --order desc --json id \
            --jq '.[1:][] | .id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

  # The required jobs' verdict, always reported: a skipped job (a change to
  # the docs alone) passes, a failed or cancelled one fails it.
  ci:
    needs: [changes, headless, typescript, examples, site, site-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo '${{ toJSON(needs) }}' | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null
