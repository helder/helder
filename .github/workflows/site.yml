# The examples' pages and the docs (site/, docs/: bun run site), built and
# checked, not deployed: helder.build's deploy builds them from main on its
# own theme and serves them at helder.build/examples/ and /docs/. Here:
# every example that runs in a browser built for the web, the pages and the
# docs built and run (an unknown example, region, component, page or heading
# link fails the build), then the pages in headless Chromium (bun run
# site:check: every card, every demo played, every docs page and the docs'
# own examples, the top bar's links on an iPhone's screen), its screenshots
# kept a week. SITE_SKIP_DATA: the examples of fetched models (Sponza's,
# tens of MB) listed without a Play button. Not required while the stack is
# unstable, as ci's browser job.
name: site

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, examples/**, src/helder/web/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, docs/**, examples/**, src/helder/web/**, .github/workflows/site.yml]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fonts (DejaVu Sans, for the ui and text examples), Mesa and Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy --no-install-recommends fonts-dejavu-core libegl1 libegl-mesa0
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium > /dev/null
      - name: Build
        env:
          SITE_SKIP_DATA: 1
        run: bun run site
      - name: Check (the pages in Chromium)
        run: bun run site:check bin/site-check
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: site, path: bin/site-check/*.png, retention-days: 7, if-no-files-found: ignore}
